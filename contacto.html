<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículum Vitae - [Tu Nombre]</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <img src="ernesto.jpg" alt="Foto de perfil">
    <h1>Ernesto Federico Rubiolo</h1>
    <p>"Servicio técnico de páginas web, automatización en WhatsApp Business, gestión en Google Drive."</p>
  </header>

  <nav>
    <ul>
      <li><a href="cv.html">Personal Information</a></li>
      <li><a href="#contacto">Contact</a></li>
    </ul>
  </nav>
  <div id="idiomas">
    <a href="cv.html">
        <img src="español.jpg" alt="Español" width="50" height="25"> 
    </a>
    <a href="index.html">
        <img src="ingles.png" alt="English" width="50" height="25"> 
    </a>
</div>
<main>
  <section id="contactos">
    <h2>Enviar WhatsApp</h2>
    <form id="whatsappForm">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
        </div>
        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" required>
        </div>
        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" required></textarea>
        </div>
        <button type="submit">Enviar WhatsApp</button>
    </form>
    <div id="map">
        <h3>Nuestra Ubicación</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31510.401138211845!2d-58.431779!3d-34.616427!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95a335eaf2b8f14b%3A0xf5bb0f4c88f6c1dc!2sVilla%20Crespo%2C%20CABA!5e0!3m2!1ses!2sar!4v1632745261741!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</section>
</main>
  <footer>
    <p>&copy;2024 - Todos los derechos reservados.</p>
    <p><a href="#personal">Volver arriba</a></p>
  </footer>
  <script>
    document.getElementById('whatsappForm').addEventListener('submit', function(event) {
 event.preventDefault(); // Prevent form submission
 
 // Get input values
 const nombre = document.getElementById('nombre').value;
 const apellido = document.getElementById('apellido').value;
 const mensaje = document.getElementById('mensaje').value;

 // Formatted WhatsApp message
 const formattedMessage = `Sr/Sra ${nombre} ${apellido}, ${mensaje}`;
 
 // WhatsApp URL, always sending to +5491130613999
 const whatsappUrl = `https://wa.me/5491130613999?text=${encodeURIComponent(formattedMessage)}`;
 
 // Redirect to WhatsApp link
 window.location.href = whatsappUrl;
});

 </script>
</body>
</html>
